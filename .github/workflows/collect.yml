name: collect-wishes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/collect.mjs', 'data/config.json', '.github/workflows/collect.yml']

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull wishes from the relay
        run: node scripts/collect.mjs
      - name: Archive
        run: |
          git config user.name "wish-collector"
          git config user.email "wish-collector@users.noreply.github.com"
          git add data/
          if git diff --quiet --cached; then
            echo "no new wishes"
          else
            git commit -m "collect: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
