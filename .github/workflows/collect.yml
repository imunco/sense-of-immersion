name: collect-wishes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/collect.mjs'
      - 'data/config.json'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: collect-wishes
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 从中转站拉取新的愿望（校验 / 审查 / 限流 / 加密）
        env:
          WISH_ADMIN_PASSPHRASE: ${{ secrets.WISH_ADMIN_PASSPHRASE }}
        run: node scripts/collect.mjs

      - name: 归档并提交
        run: |
          git config user.name "wish-collector"
          git config user.email "wish-collector@users.noreply.github.com"
          git fetch origin main --quiet
          for attempt in 1 2 3 4 5; do
            git add data/
            if git diff --quiet --cached; then
              echo "没有新愿望"
              exit 0
            fi
            git commit -q -m "collect: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if git push --quiet 2>/dev/null; then
              echo "已推送"
              exit 0
            fi
            echo "推送被拒（并发），第 $attempt 次重试"
            git fetch origin main --quiet
            git reset --hard FETCH_HEAD
            node scripts/collect.mjs
          done
          echo "重试 5 次仍失败"; exit 1
